<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1712">
<title>Pixel Delve</title>
<style>
  :root {
    --stone-dark: #1c1712;
    --stone-mid: #2b241c;
    --stone-tile: #3a3226;
    --parchment: #e8ddc7;
    --parchment-dim: #a89a80;
    --amber: #e8a33d;
    --moss: #6a8f4f;
    --moss-dark: #4d6b38;
    --ember: #c1442e;
    --skin: #e8b98a;
    --fur-brown: #8a6a4b;

    --font-display: ui-rounded, 'Segoe UI Rounded', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', 'Courier New', monospace;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--stone-dark);
    color: var(--parchment);
    font-family: var(--font-mono);
    touch-action: manipulation;
  }

  #game-container {
    max-width: 420px;
    margin: 0 auto;
    padding: 16px 16px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: 0.5px;
    margin: 4px 0 0;
    color: var(--amber);
  }

  #subtitle {
    font-size: 0.75rem;
    color: var(--parchment-dim);
    text-align: center;
    margin: 0 0 6px;
  }

  #hud {
    width: 100%;
    max-width: 352px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    padding: 6px 10px;
    background: var(--stone-mid);
    border: 1px solid var(--stone-tile);
    border-radius: 6px;
  }

  #hp-block {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #hp-bar-bg {
    width: 100px;
    height: 11px;
    background: var(--stone-dark);
    border: 1px solid var(--stone-tile);
    border-radius: 6px;
    overflow: hidden;
  }

  #hp-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ember), var(--amber));
    width: 100%;
    transition: width 0.2s ease;
  }

  canvas {
    width: 100%;
    max-width: 352px;
    height: auto;
    image-rendering: pixelated;
    background: var(--stone-dark);
    border: 2px solid var(--stone-tile);
    border-radius: 8px;
    touch-action: none;
  }

  #message-log {
    width: 100%;
    max-width: 352px;
    min-height: 68px;
    font-size: 0.74rem;
    background: var(--stone-mid);
    border: 1px solid var(--stone-tile);
    border-left: 3px solid var(--amber);
    border-radius: 4px;
    padding: 7px 10px;
    line-height: 1.5;
    color: var(--parchment-dim);
  }

  #message-log div::before {
    content: "› ";
    color: var(--amber);
  }

  #message-log div:last-child {
    color: var(--parchment);
  }

  #controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
  }

  .dpad-row {
    display: flex;
    gap: 6px;
    justify-content: center;
  }

  .dpad-btn {
    width: 56px;
    height: 56px;
    font-size: 1.3rem;
    font-family: var(--font-mono);
    background: var(--stone-tile);
    color: var(--parchment);
    border: 1px solid #4a4032;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.06),
      inset -2px -2px 0 rgba(0,0,0,0.35),
      0 2px 0 rgba(0,0,0,0.4);
  }

  .dpad-btn:active {
    box-shadow:
      inset 2px 2px 0 rgba(0,0,0,0.35),
      inset -2px -2px 0 rgba(255,255,255,0.04);
    transform: translateY(1px);
  }

  .dpad-btn:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .dpad-spacer {
    width: 56px;
    height: 56px;
  }

  .wait-btn {
    font-size: 1.4rem;
  }

  #game-over-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 6, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  #game-over-overlay.hidden {
    display: none;
  }

  #game-over-box {
    background: var(--stone-mid);
    border: 1px solid var(--stone-tile);
    border-top: 3px solid var(--ember);
    border-radius: 10px;
    padding: 28px 34px;
    text-align: center;
  }

  #game-over-box h2 {
    font-family: var(--font-display);
    margin: 0 0 8px;
    color: var(--ember);
  }

  #btn-restart {
    margin-top: 14px;
    padding: 10px 22px;
    font-size: 1rem;
    font-family: var(--font-mono);
    font-weight: bold;
    background: var(--moss);
    color: var(--stone-dark);
    border: none;
    border-radius: 6px;
  }

  #btn-restart:active {
    background: var(--moss-dark);
  }

  #btn-restart:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .dpad-btn:active { transform: none; }
    #hp-bar-fill { transition: none; }
  }
</style>
</head>
<body>

<div id="game-container">
  <h1>⚔️ Pixel Delve</h1>
  <p id="subtitle">Bump monsters to fight. Reach the gold stairs to descend.</p>

  <div id="hud">
    <div id="hp-block">
      <span>HP</span>
      <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div>
      <span id="hp-text">20/20</span>
    </div>
    <div id="floor-block">Floor <span id="floor-text">1</span></div>
  </div>

  <canvas id="game-canvas" width="352" height="480"></canvas>

  <div id="message-log"></div>

  <div id="controls">
    <div class="dpad-row">
      <div class="dpad-spacer"></div>
      <button id="btn-up" class="dpad-btn" aria-label="Move up">▲</button>
      <div class="dpad-spacer"></div>
    </div>
    <div class="dpad-row">
      <button id="btn-left" class="dpad-btn" aria-label="Move left">◀</button>
      <button id="btn-wait" class="dpad-btn wait-btn" aria-label="Wait">⏳</button>
      <button id="btn-right" class="dpad-btn" aria-label="Move right">▶</button>
    </div>
    <div class="dpad-row">
      <div class="dpad-spacer"></div>
      <button id="btn-down" class="dpad-btn" aria-label="Move down">▼</button>
      <div class="dpad-spacer"></div>
    </div>
  </div>
</div>

<div id="game-over-overlay" class="hidden">
  <div id="game-over-box">
    <h2>You Died</h2>
    <p id="final-floor-text"></p>
    <button id="btn-restart">Try Again</button>
  </div>
</div>

<script>
/* ============================================================
   PIXEL DELVE — a tiny turn-based roguelike
   ============================================================
   How the game works, in plain terms:
   1. We build a dungeon floor out of small rooms connected by
      hallways (see generateDungeon).
   2. The player moves one tile at a time. Every time the player
      acts, that's a "turn" — then all the monsters get to act too.
      That's what makes it "turn-based" instead of real-time.
   3. Walking into a monster attacks it instead of moving.
   4. Walking onto the gold stairs takes you to a brand new,
      randomly generated floor.
   ============================================================ */

/* ---------- CONSTANTS ---------- */
const WALL = 0;
const FLOOR = 1;
const STAIRS = 2;

const COLS = 11;   // dungeon width, in tiles
const ROWS = 15;   // dungeon height, in tiles
const TILE = 32;   // size of one tile, in pixels

const ENEMY_TEMPLATES = {
  rat:    { name: 'Rat',    hp: 5, atk: 1, detect: 4 },
  goblin: { name: 'Goblin', hp: 9, atk: 3, detect: 5 },
};

/* ---------- CANVAS SETUP ---------- */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

/* ---------- COLOR TOKENS ----------
   All colors are defined once, as CSS variables up in <style>.
   We read them here so the canvas drawing code and the page
   styling always agree. Want to retheme the whole game? Change
   the CSS variables at the top of the file — everything below
   just follows along. */
function readColorTokens() {
  const style = getComputedStyle(document.documentElement);
  const read = (name) => style.getPropertyValue(name).trim();
  return {
    stoneDark: read('--stone-dark'),
    stoneMid: read('--stone-mid'),
    stoneTile: read('--stone-tile'),
    parchment: read('--parchment'),
    parchmentDim: read('--parchment-dim'),
    amber: read('--amber'),
    moss: read('--moss'),
    mossDark: read('--moss-dark'),
    ember: read('--ember'),
    skin: read('--skin'),
    furBrown: read('--fur-brown'),
  };
}
const COLORS = readColorTokens();

/* ---------- GAME STATE ----------
   Everything about "right now" lives in this one object.
   That makes it easy to reset (just rebuild the pieces) and
   easy to reason about — one place to look for "what's
   happening in the game at this instant." */
let state = {
  floor: 1,
  map: null,
  player: null,
  enemies: [],
  messages: [],
  gameOver: false,
};


/* ============================================================
   DUNGEON GENERATION
   ============================================================ */

function generateDungeon(floorNum) {
  const grid = [];
  for (let y = 0; y < ROWS; y++) {
    grid.push(new Array(COLS).fill(WALL));
  }

  const rooms = [];
  const targetRoomCount = 5 + Math.floor(Math.random() * 3); // 5-7 rooms
  let attempts = 0;

  while (rooms.length < targetRoomCount && attempts < 300) {
    attempts++;

    const w = 3 + Math.floor(Math.random() * 3); // 3-5 tiles wide
    const h = 3 + Math.floor(Math.random() * 3); // 3-5 tiles tall
    const x = 1 + Math.floor(Math.random() * (COLS - w - 2));
    const y = 1 + Math.floor(Math.random() * (ROWS - h - 2));
    const candidate = { x, y, w, h };

    const overlapsExisting = rooms.some(r => roomsOverlap(candidate, r, 1));
    if (overlapsExisting) continue;

    carveRoom(grid, candidate);
    rooms.push(candidate);
  }

  // Safety net: on the extremely unlikely chance we didn't manage
  // to place enough rooms, just try the whole thing again.
  if (rooms.length < 2) {
    return generateDungeon(floorNum);
  }

  // Connect each room to the next with a corridor, so the whole
  // floor is reachable.
  for (let i = 1; i < rooms.length; i++) {
    carveCorridor(grid, roomCenter(rooms[i - 1]), roomCenter(rooms[i]));
  }

  const stairsPos = roomCenter(rooms[rooms.length - 1]);
  grid[stairsPos.y][stairsPos.x] = STAIRS;

  const playerStart = roomCenter(rooms[0]);

  return { grid, rooms, stairsPos, playerStart };
}

function roomsOverlap(a, b, buffer) {
  return !(
    a.x + a.w + buffer < b.x ||
    b.x + b.w + buffer < a.x ||
    a.y + a.h + buffer < b.y ||
    b.y + b.h + buffer < a.y
  );
}

function carveRoom(grid, room) {
  for (let y = room.y; y < room.y + room.h; y++) {
    for (let x = room.x; x < room.x + room.w; x++) {
      grid[y][x] = FLOOR;
    }
  }
}

function roomCenter(room) {
  return {
    x: room.x + Math.floor(room.w / 2),
    y: room.y + Math.floor(room.h / 2),
  };
}

function carveCorridor(grid, a, b) {
  let x = a.x;
  let y = a.y;
  const horizontalFirst = Math.random() < 0.5;

  if (horizontalFirst) {
    while (x !== b.x) { grid[y][x] = FLOOR; x += x < b.x ? 1 : -1; }
    while (y !== b.y) { grid[y][x] = FLOOR; y += y < b.y ? 1 : -1; }
  } else {
    while (y !== b.y) { grid[y][x] = FLOOR; y += y < b.y ? 1 : -1; }
    while (x !== b.x) { grid[y][x] = FLOOR; x += x < b.x ? 1 : -1; }
  }
  grid[y][x] = FLOOR;
}


/* ============================================================
   ENTITIES (player + monsters)
   ============================================================ */

function createPlayer(x, y) {
  return { x, y, hp: 20, maxHp: 20, atk: 4 };
}

function spawnEnemies(dungeon, floorNum) {
  const enemies = [];
  const types = Object.keys(ENEMY_TEMPLATES);
  const roomsForEnemies = dungeon.rooms.slice(1); // skip the player's start room

  roomsForEnemies.forEach(room => {
    const count = randomEnemyCountForRoom();
    for (let i = 0; i < count; i++) {
      const pos = randomFloorTileInRoom(dungeon.grid, room);
      if (!pos) continue;
      const type = types[Math.floor(Math.random() * types.length)];
      enemies.push(createEnemy(type, pos.x, pos.y, floorNum));
    }
  });

  return enemies;
}

function randomEnemyCountForRoom() {
  const roll = Math.random();
  if (roll < 0.55) return 1;
  if (roll < 0.70) return 2;
  return 0;
}

function randomFloorTileInRoom(grid, room) {
  for (let attempt = 0; attempt < 20; attempt++) {
    const x = room.x + Math.floor(Math.random() * room.w);
    const y = room.y + Math.floor(Math.random() * room.h);
    if (grid[y][x] === FLOOR) return { x, y };
  }
  return null;
}

function createEnemy(type, x, y, floorNum) {
  const template = ENEMY_TEMPLATES[type];
  const scale = 1 + (floorNum - 1) * 0.15; // monsters get a little stronger each floor

  return {
    type,
    name: template.name,
    x, y,
    hp: Math.round(template.hp * scale),
    maxHp: Math.round(template.hp * scale),
    atk: Math.max(1, Math.round(template.atk * scale)),
    detect: template.detect,
  };
}


/* ============================================================
   TURNS, MOVEMENT & COMBAT
   ============================================================ */

function tryPlayerMove(dx, dy) {
  if (state.gameOver) return;

  const nx = state.player.x + dx;
  const ny = state.player.y + dy;
  if (!inBounds(nx, ny)) return;

  const targetTile = state.map[ny][nx];

  if (targetTile === WALL) {
    return; // bumping a wall doesn't cost a turn
  }

  const target = enemyAt(nx, ny);
  if (target) {
    resolveAttack(state.player, target, 'You', target.name);
  } else {
    state.player.x = nx;
    state.player.y = ny;

    if (targetTile === STAIRS) {
      state.player.hp += 1;
      descend();
      return; // descending starts a fresh floor; skip the enemy turn below
    }
  }

  enemyTurn();
  render();
}

function waitTurn() {
  if (state.gameOver) return;
  addMessage('You wait.');
  enemyTurn();
  render();
}

function resolveAttack(attacker, defender, attackerLabel, defenderLabel) {
  const dmg = Math.max(1, attacker.atk + Math.floor(Math.random() * 3) - 1);
  defender.hp -= dmg;
  addMessage(`${attackerLabel} hit${attackerLabel === 'You' ? '' : 's'} ${defenderLabel} for ${dmg}.`);

  if (defender.hp <= 0) {
    if (defender === state.player) {
      handleGameOver();
    } else {
      addMessage(`The ${defender.name} is defeated!`);
      state.enemies = state.enemies.filter(e => e !== defender);
    }
  }
}

function enemyTurn() {
  if (state.gameOver) return;

  state.enemies.forEach(enemy => {
    if (enemy.hp <= 0) return;

    const dist = chebyshevDistance(enemy, state.player);

    if (dist === 1) {
      resolveAttack(enemy, state.player, enemy.name, 'you');
      return;
    }

    if (dist <= enemy.detect) {
      stepEnemyToward(enemy, state.player);
    } else if (Math.random() < 0.5) {
      wanderEnemy(enemy);
    }
  });
}

function stepEnemyToward(enemy, target) {
  const dx = Math.sign(target.x - enemy.x);
  const dy = Math.sign(target.y - enemy.y);
  const preferHorizontal = Math.abs(target.x - enemy.x) > Math.abs(target.y - enemy.y);

  const tryOrder = preferHorizontal
    ? [{ x: enemy.x + dx, y: enemy.y }, { x: enemy.x, y: enemy.y + dy }]
    : [{ x: enemy.x, y: enemy.y + dy }, { x: enemy.x + dx, y: enemy.y }];

  for (const step of tryOrder) {
    if (canEnemyStandOn(step.x, step.y)) {
      enemy.x = step.x;
      enemy.y = step.y;
      return;
    }
  }
}

function wanderEnemy(enemy) {
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const [dx, dy] = dirs[Math.floor(Math.random() * dirs.length)];
  const nx = enemy.x + dx;
  const ny = enemy.y + dy;
  if (canEnemyStandOn(nx, ny)) {
    enemy.x = nx;
    enemy.y = ny;
  }
}

function canEnemyStandOn(x, y) {
  if (!inBounds(x, y)) return false;
  if (state.map[y][x] === WALL) return false;
  if (x === state.player.x && y === state.player.y) return false;
  if (enemyAt(x, y)) return false;
  return true;
}


/* ============================================================
   FLOORS, GAME OVER & RESTART
   ============================================================ */

function descend() {
  state.floor += 1;
  const dungeon = generateDungeon(state.floor);
  state.map = dungeon.grid;
  state.player.x = dungeon.playerStart.x;
  state.player.y = dungeon.playerStart.y;
  state.enemies = spawnEnemies(dungeon, state.floor);
  addMessage(`You descend to floor ${state.floor}.`);
  render();
}

function handleGameOver() {
  state.gameOver = true;
  addMessage('You have fallen...');
  document.getElementById('final-floor-text').textContent = `You reached floor ${state.floor}.`;
  document.getElementById('game-over-overlay').classList.remove('hidden');
}

function restartGame() {
  document.getElementById('game-over-overlay').classList.add('hidden');

  state.floor = 1;
  const dungeon = generateDungeon(1);
  state.map = dungeon.grid;
  state.player = createPlayer(dungeon.playerStart.x, dungeon.playerStart.y);
  state.enemies = spawnEnemies(dungeon, 1);
  state.gameOver = false;
  state.messages = [];

  addMessage('You descend into the dungeon...');
  render();
}


/* ============================================================
   RENDERING
   ============================================================ */

function render() {
  ctx.fillStyle = COLORS.stoneDark;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      drawTile(state.map[y][x], x, y);
    }
  }

  state.enemies.forEach(drawEnemy);
  drawPlayer(state.player.x, state.player.y);

  updateHUD();
}

function drawTile(tile, x, y) {
  const px = x * TILE;
  const py = y * TILE;

  if (tile === WALL) {
    ctx.fillStyle = COLORS.stoneMid;
    ctx.fillRect(px, py, TILE, TILE);
    return;
  }

  ctx.fillStyle = COLORS.stoneTile;
  ctx.fillRect(px, py, TILE, TILE);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);

  if (tile === STAIRS) {
    ctx.fillStyle = COLORS.amber;
    ctx.fillRect(px + TILE * 0.25, py + TILE * 0.25, TILE * 0.5, TILE * 0.5);
  }
}

function drawPlayer(x, y) {
  const cx = x * TILE + TILE / 2;
  const cy = y * TILE + TILE / 2;
  const r = TILE * 0.36;

  ctx.fillStyle = COLORS.moss;
  circle(cx, cy + r * 0.2, r);

  ctx.fillStyle = COLORS.skin;
  circle(cx, cy - r * 0.6, r * 0.55);

  ctx.fillStyle = COLORS.stoneDark;
  ctx.fillRect(cx - r * 0.3, cy - r * 0.7, r * 0.16, r * 0.16);
  ctx.fillRect(cx + r * 0.14, cy - r * 0.7, r * 0.16, r * 0.16);

  ctx.strokeStyle = COLORS.parchment;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.9, cy - r * 0.1);
  ctx.lineTo(cx + r * 1.5, cy - r * 0.8);
  ctx.stroke();
}

function drawEnemy(enemy) {
  if (enemy.type === 'rat') drawRat(enemy.x, enemy.y);
  else if (enemy.type === 'goblin') drawGoblin(enemy.x, enemy.y);
}

function drawRat(x, y) {
  const cx = x * TILE + TILE / 2;
  const cy = y * TILE + TILE / 2;
  const r = TILE * 0.26;

  ctx.strokeStyle = COLORS.furBrown;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.9, cy + r * 0.4);
  ctx.quadraticCurveTo(cx + r * 1.7, cy + r * 0.1, cx + r * 1.4, cy - r * 0.5);
  ctx.stroke();

  ctx.fillStyle = COLORS.furBrown;
  ellipse(cx, cy + r * 0.15, r * 1.05, r * 0.75);

  ctx.beginPath();
  ctx.moveTo(cx - r * 0.55, cy - r * 0.35);
  ctx.lineTo(cx - r * 0.9, cy - r * 1.05);
  ctx.lineTo(cx - r * 0.15, cy - r * 0.55);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + r * 0.55, cy - r * 0.35);
  ctx.lineTo(cx + r * 0.9, cy - r * 1.05);
  ctx.lineTo(cx + r * 0.15, cy - r * 0.55);
  ctx.fill();

  ctx.fillStyle = COLORS.ember;
  ctx.fillRect(cx - r * 0.4, cy - r * 0.1, r * 0.22, r * 0.22);
  ctx.fillRect(cx + r * 0.18, cy - r * 0.1, r * 0.22, r * 0.22);
}

function drawGoblin(x, y) {
  const cx = x * TILE + TILE / 2;
  const cy = y * TILE + TILE / 2;
  const r = TILE * 0.4;

  ctx.fillStyle = COLORS.mossDark;
  circle(cx, cy + r * 0.15, r);

  ctx.fillStyle = COLORS.moss;
  circle(cx, cy - r * 0.5, r * 0.5);

  ctx.strokeStyle = COLORS.stoneDark;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.35, cy - r * 0.66);
  ctx.lineTo(cx - r * 0.08, cy - r * 0.54);
  ctx.moveTo(cx + r * 0.35, cy - r * 0.66);
  ctx.lineTo(cx + r * 0.08, cy - r * 0.54);
  ctx.stroke();

  ctx.fillStyle = COLORS.amber;
  ctx.fillRect(cx - r * 0.3, cy - r * 0.55, r * 0.18, r * 0.18);
  ctx.fillRect(cx + r * 0.12, cy - r * 0.55, r * 0.18, r * 0.18);
}

function circle(cx, cy, r) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
}

function ellipse(cx, cy, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

function updateHUD() {
  const hp = Math.max(0, state.player.hp);
  document.getElementById('hp-text').textContent = `${hp}/${state.player.maxHp}`;
  document.getElementById('hp-bar-fill').style.width = `${(hp / state.player.maxHp) * 100}%`;
  document.getElementById('floor-text').textContent = state.floor;
}

function addMessage(msg) {
  state.messages.push(msg);
  if (state.messages.length > 4) state.messages.shift();

  const log = document.getElementById('message-log');
  log.innerHTML = '';
  state.messages.forEach(m => {
    const line = document.createElement('div');
    line.textContent = m;
    log.appendChild(line);
  });
}


/* ============================================================
   HELPERS
   ============================================================ */

function inBounds(x, y) {
  return x >= 0 && x < COLS && y >= 0 && y < ROWS;
}

function enemyAt(x, y) {
  return state.enemies.find(e => e.x === x && e.y === y && e.hp > 0);
}

function chebyshevDistance(a, b) {
  return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
}


/* ============================================================
   INPUT
   ============================================================ */

window.addEventListener('keydown', (e) => {
  const moves = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };

  if (moves[e.key]) {
    e.preventDefault();
    tryPlayerMove(moves[e.key][0], moves[e.key][1]);
  } else if (e.key === ' ') {
    e.preventDefault();
    waitTurn();
  }
});

document.getElementById('btn-up').addEventListener('click', () => tryPlayerMove(0, -1));
document.getElementById('btn-down').addEventListener('click', () => tryPlayerMove(0, 1));
document.getElementById('btn-left').addEventListener('click', () => tryPlayerMove(-1, 0));
document.getElementById('btn-right').addEventListener('click', () => tryPlayerMove(1, 0));
document.getElementById('btn-wait').addEventListener('click', waitTurn);
document.getElementById('btn-restart').addEventListener('click', restartGame);


/* ============================================================
   BOOT
   ============================================================ */

function initGame() {
  const dungeon = generateDungeon(1);
  state.map = dungeon.grid;
  state.player = createPlayer(dungeon.playerStart.x, dungeon.playerStart.y);
  state.enemies = spawnEnemies(dungeon, 1);
  addMessage('You descend into the dungeon...');
  render();
}

initGame();
</script>
