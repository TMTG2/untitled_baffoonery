<!DOCTYPE html>
<!--
  Pixel Delve - single-file tiny game.
  I added comments throughout the HTML, CSS and JavaScript so you can teach your 9-year-old nephew.
  The comments try to keep the language simple and friendly. They'll explain what each section does,
  and what the important bits of code mean. Enjoy! <3
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport tells the phone or browser how to scale the page -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1712">
<title>Pixel Delve</title>

<!--
  CSS section: styles that make the game look nice.
  In CSS you pick elements (like body, buttons, canvas) and tell the browser
  how they should look (colors, size, layout).
-->
<style>
  /* :root is where we put "variables" for colors and fonts.
     Variables start with -- and make it easier to change the theme later. */
  :root {
    --stone-dark: #1c1712;    /* background color for dungeon and page */
    --stone-mid: #2b241c;     /* slightly lighter rock color */
    --stone-tile: #3a3226;    /* tile color for floor tiles */
    --parchment: #e8ddc7;     /* light text color */
    --parchment-dim: #a89a80; /* dimmer text color for less important text */
    --amber: #e8a33d;         /* highlight / accent color */
    --moss: #6a8f4f;          /* green for player clothing */
    --moss-dark: #ff0000;     /* darker green for pressed buttons */
    --ember: #c1442e;         /* red/orange used for enemy eyes and highlights */
    --skin: #e8b98a;          /* player skin color */
    --fur-brown: #8a6a4b;     /* color used on the rat */

    --font-display: ui-rounded, 'Segoe UI Rounded', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', 'Courier New', monospace;
  }

  /* Basic reset so things look consistent across browsers */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent; /* removes highlight on mobile when tapping */
  }

  /* The page background and default text styles */
  html, body {
    margin: 0;
    padding: 0;
    background: var(--stone-dark);
    color: var(--parchment);
    font-family: var(--font-mono);
    touch-action: manipulation; /* help mobile behave like buttons */
  }

  /* The main container keeps the game centered and adds some padding */
  #game-container {
    max-width: 420px;
    margin: 0 auto;
    padding: 16px 16px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  /* Heading style — the big title */
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: 0.5px;
    margin: 4px 0 0;
    color: var(--amber);
  }

  /* Small subtitle under the title */
  #subtitle {
    font-size: 0.75rem;
    color: var(--parchment-dim);
    text-align: center;
    margin: 0 0 6px;
  }

  /* HUD bar showing HP, floor and gold */
  #hud {
    width: 100%;
    max-width: 352px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    padding: 6px 10px;
    background: var(--stone-mid);
    border: 1px solid var(--stone-tile);
    border-radius: 6px;
  }

  /* Grouping HP elements so they sit in a row */
  #hp-block {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* HP bar background box */
  #hp-bar-bg {
    width: 100px;
    height: 11px;
    background: var(--stone-dark);
    border: 1px solid var(--stone-tile);
    border-radius: 6px;
    overflow: hidden; /* prevents the fill from spilling out */
  }

  /* HP bar fill — the width changes in JavaScript to show health */
  #hp-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ember), var(--amber));
    width: 100%; /* JS will change this value */
    transition: width 0.2s ease; /* smooth animation when HP changes */
  }

  /* The canvas is where the game is drawn with JavaScript */
  canvas {
    width: 100%;
    max-width: 352px; /* keep canvas same width as HUD */
    height: auto;
    image-rendering: pixelated; /* keeps pixel-art look sharp */
    background: var(--stone-dark);
    border: 2px solid var(--stone-tile);
    border-radius: 8px;
    touch-action: none; /* canvas handles touch manually in JS */
  }

  /* Message log box where game messages appear */
  #message-log {
    width: 100%;
    max-width: 352px;
    min-height: 68px;
    font-size: 0.74rem;
    background: var(--stone-mid);
    border: 1px solid var(--stone-tile);
    border-left: 3px solid var(--amber);
    border-radius: 4px;
    padding: 7px 10px;
    line-height: 1.5;
    color: var(--parchment-dim);
  }

  /* The little arrow before each line in the message log */
  #message-log div::before {
    content: "› ";
    color: var(--amber);
  }

  /* The newest message should be brighter so you can read it */
  #message-log div:last-child {
    color: var(--parchment);
  }

  /* Controls area for on-screen buttons */
  #controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
  }

  .dpad-row {
    display: flex;
    gap: 6px;
    justify-content: center;
  }

  /* Style for the directional pad buttons */
  .dpad-btn {
    width: 56px;
    height: 56px;
    font-size: 1.3rem;
    font-family: var(--font-mono);
    background: var(--stone-tile);
    color: var(--parchment);
    border: 1px solid #4a4032;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none; /* prevents text selection when tapping */
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.06),
      inset -2px -2px 0 rgba(0,0,0,0.35),
      0 2px 0 rgba(0,0,0,0.4);
  }

  .dpad-btn:active {
    /* pressed look */
    box-shadow:
      inset 2px 2px 0 rgba(0,0,0,0.35),
      inset -2px -2px 0 rgba(255,255,255,0.04);
    transform: translateY(1px);
  }

  .dpad-btn:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .dpad-spacer {
    width: 56px;
    height: 56px;
  }

  .wait-btn {
    font-size: 1.4rem;
  }

  /* Game over overlay that covers the screen when the player dies */
  #game-over-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 6, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  /* When the hidden class is present we hide overlays */
  #game-over-overlay.hidden {
    display: none;
  }

  #game-over-box {
    background: var(--stone-mid);
    border: 1px solid var(--stone-tile);
    border-top: 3px solid var(--ember);
    border-radius: 10px;
    padding: 28px 34px;
    text-align: center;
  }

  #game-over-box h2 {
    font-family: var(--font-display);
    margin: 0 0 8px;
    color: var(--ember);
  }

  #btn-restart {
    margin-top: 14px;
    padding: 10px 22px;
    font-size: 1rem;
    font-family: var(--font-mono);
    font-weight: bold;
    background: var(--moss);
    color: var(--stone-dark);
    border: none;
    border-radius: 6px;
  }

  #btn-restart:active { background: var(--moss-dark); }
  #btn-restart:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* Upgrades overlay shown between runs */
  #upgrades-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 6, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 11;
  }

  #upgrades-overlay.hidden { display: none; }

  #upgrades-box {
    background: var(--stone-mid);
    border: 1px solid var(--stone-tile);
    border-top: 3px solid var(--moss);
    border-radius: 10px;
    padding: 20px 24px;
    text-align: left;
    color: var(--parchment);
    width: 320px;
  }

  #upgrades-box h3 { margin: 0 0 8px; color: var(--moss); }
  .upgrade-row { display:flex; justify-content:space-between; align-items:center; margin:8px 0; }
  .upgrade-row .cost { color: var(--amber); margin-left:8px; }
  .upgrade-btn { padding:6px 10px; border-radius:6px; background:var(--amber); color:var(--stone-dark); border:none; font-weight:bold; }
  .start-btn { margin-top:12px; padding:8px 12px; border-radius:6px; background:var(--moss); color:var(--stone-dark); border:none; font-weight:bold; }

  /* Accessibility: if someone asked for reduced motion, we turn off animations */
  @media (prefers-reduced-motion: reduce) {
    .dpad-btn:active { transform: none; }
    #hp-bar-fill { transition: none; }
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- The visible title and subtitle -->
  <h1>⚔️ Pixel Delve</h1>
  <p id="subtitle">Bump monsters to fight. Reach the gold stairs to descend.</p>

  <!-- HUD: shows HP, floor and gold -->
  <div id="hud">
    <div id="hp-block">
      <span>HP</span>
      <!-- hp-bar-bg is the box, hp-bar-fill is the colored part that changes width -->
      <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div>
      <span id="hp-text">20/20</span>
    </div>
    <div id="floor-block">Floor <span id="floor-text">1</span></div>
    <div id="gold-block">Gold <span id="gold-text">0</span></div>
  </div>

  <!-- This canvas is where the JavaScript draws the dungeon and characters -->
  <canvas id="game-canvas" width="352" height="480"></canvas>

  <!-- Messages from the game (like "You hit the goblin for 3") appear here -->
  <div id="message-log"></div>

  <!-- On-screen controls for touch devices (and mouse) -->
  <div id="controls">
    <div class="dpad-row">
      <div class="dpad-spacer"></div>
      <button id="btn-up" class="dpad-btn" aria-label="Move up">▲</button>
      <div class="dpad-spacer"></div>
    </div>
    <div class="dpad-row">
      <button id="btn-left" class="dpad-btn" aria-label="Move left">◀</button>
      <button id="btn-wait" class="dpad-btn wait-btn" aria-label="Wait">⏳</button>
      <button id="btn-right" class="dpad-btn" aria-label="Move right">▶</button>
    </div>
    <div class="dpad-row">
      <div class="dpad-spacer"></div>
      <button id="btn-down" class="dpad-btn" aria-label="Move down">▼</button>
      <div class="dpad-spacer"></div>
    </div>
  </div>
</div>

<!-- Game over overlay is hidden until the player dies -->
<div id="game-over-overlay" class="hidden">
  <div id="game-over-box">
    <h2>You Died</h2>
    <p id="final-floor-text"></p>
    <button id="btn-restart">Try Again</button>
  </div>
</div>

<!-- Upgrades overlay shows between runs so you can spend gold -->
<div id="upgrades-overlay" class="hidden">
  <div id="upgrades-box">
    <h3>Upgrades</h3>
    <p id="upgrades-gold-text">Gold: 0</p>
    <div class="upgrade-row">
      <div>
        <div>Increase Max HP</div>
        <div style="font-size:0.85rem;color:var(--parchment-dim);">Current: <span id="current-maxhp">20</span></div>
      </div>
      <div>
        <button id="buy-maxhp" class="upgrade-btn">Buy (<span class="cost" id="cost-maxhp">21</span>)</button>
      </div>
    </div>
    <div class="upgrade-row">
      <div>
        <div>Increase Atk</div>
        <div style="font-size:0.85rem;color:var(--parchment-dim);">Current: <span id="current-atk">4</span></div>
      </div>
      <div>
        <button id="buy-atk" class="upgrade-btn">Buy (<span class="cost" id="cost-atk">5</span>)</button>
      </div>
    </div>
    <button id="start-next" class="start-btn">Start Next Run</button>
  </div>
</div>

<script>
/* ============================================================
   JAVASCRIPT: game logic, drawing and input handling.
   The comments below explain what each part does in simple language.
   If you are reading this with your nephew, feel free to skip around.
   Try running the game and showing him how changing small values
   (like player HP) affects gameplay.
   ============================================================ */

/* ---------- CONSTANTS ---------- */
// Constants are names we use for numbers so the code is easier to read.
const WALL = 0;   // a tile that cannot be walked on
const FLOOR = 1;  // a normal tile you can walk on
const STAIRS = 2; // the stairs that take you down a floor

const COLS = 11;   // how many tiles fit across the map
const ROWS = 15;   // how many tiles fit vertically
const TILE = 32;   // how many pixels one tile is when drawing on canvas

// Templates define enemy types. It's like a recipe for making a rat or goblin.
const ENEMY_TEMPLATES = {
  rat:    { name: 'Rat',    hp: 5, atk: 1, detect: 4, gold: 1 },
  goblin: { name: 'Goblin', hp: 9, atk: 3, detect: 5, gold: 2 },
};

/* ---------- CANVAS SETUP ---------- */
// The canvas is an HTML element that lets us draw shapes and pictures with JavaScript.
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d'); // ctx is the drawing context

/* ---------- COLOR TOKENS ---------- */
// We read the CSS color variables so the drawing code uses the same palette.
function readColorTokens() {
  const style = getComputedStyle(document.documentElement);
  const read = (name) => style.getPropertyValue(name).trim();
  return {
    stoneDark: read('--stone-dark'),
    stoneMid: read('--stone-mid'),
    stoneTile: read('--stone-tile'),
    parchment: read('--parchment'),
    parchmentDim: read('--parchment-dim'),
    amber: read('--amber'),
    moss: read('--moss'),
    mossDark: read('--moss-dark'),
    ember: read('--ember'),
    skin: read('--skin'),
    furBrown: read('--fur-brown'),
  };
}
const COLORS = readColorTokens();

/* ---------- GAME STATE ---------- */
// The game keeps its current information (state) in these objects.
let persistent = loadPersistent(); // persistent stores upgrades and gold between runs

let state = {
  floor: 1,       // current floor number
  map: null,      // 2D array (grid) for the dungeon
  player: null,   // player object with x/y/hp/atk
  enemies: [],    // list of enemy objects
  messages: [],   // recent messages to show in the message log
  gameOver: false // true when player dies
};

/* ============================================================
   PERSISTENCE (simple localStorage for upgrades & gold)
   localStorage remembers small data in the browser so gold and
   upgrades stay when you close and reopen the page.
   ============================================================ */
function loadPersistent() {
  try {
    const raw = localStorage.getItem('pixelDelvePersistent');
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  // default values if nothing was saved yet
  return { gold: 0, baseMaxHp: 20, baseAtk: 4 };
}
function savePersistent() {
  try { localStorage.setItem('pixelDelvePersistent', JSON.stringify(persistent)); } catch (e) {}
}

/* ============================================================
   DUNGEON GENERATION
   We build a simple map by placing a few rectangular rooms and
   connecting them with corridors. This makes each floor different.
   ============================================================ */
function generateDungeon(floorNum) {
  // create a grid filled with WALL values
  const grid = [];
  for (let y = 0; y < ROWS; y++) {
    grid.push(new Array(COLS).fill(WALL));
  }

  const rooms = [];
  // we aim for 5 to 7 rooms per floor
  const targetRoomCount = 5 + Math.floor(Math.random() * 3); // 5-7 rooms
  let attempts = 0;

  // try to add rooms until we reach the target
  while (rooms.length < targetRoomCount && attempts < 300) {
    attempts++;

    const w = 3 + Math.floor(Math.random() * 3); // room width 3-5 tiles
    const h = 3 + Math.floor(Math.random() * 3); // room height 3-5 tiles
    const x = 1 + Math.floor(Math.random() * (COLS - w - 2)); // random position
    const y = 1 + Math.floor(Math.random() * (ROWS - h - 2));
    const candidate = { x, y, w, h };

    // avoid overlapping rooms
    const overlapsExisting = rooms.some(r => roomsOverlap(candidate, r, 1));
    if (overlapsExisting) continue;

    carveRoom(grid, candidate); // turn the chosen rectangle into floor tiles
    rooms.push(candidate);
  }

  // if we couldn't place enough rooms, try again recursively
  if (rooms.length < 2) {
    return generateDungeon(floorNum);
  }

  // connect rooms in order with corridors
  for (let i = 1; i < rooms.length; i++) {
    carveCorridor(grid, roomCenter(rooms[i - 1]), roomCenter(rooms[i]));
  }

  // place stairs in the last room and the player in the first room
  const stairsPos = roomCenter(rooms[rooms.length - 1]);
  grid[stairsPos.y][stairsPos.x] = STAIRS;

  const playerStart = roomCenter(rooms[0]);

  return { grid, rooms, stairsPos, playerStart };
}

// Helper: check if two rooms overlap (with a little buffer)
function roomsOverlap(a, b, buffer) {
  return !(
    a.x + a.w + buffer < b.x ||
    b.x + b.w + buffer < a.x ||
    a.y + a.h + buffer < b.y ||
    b.y + b.h + buffer < a.y
  );
}

// Turns a rectangle area of the grid into FLOOR tiles
function carveRoom(grid, room) {
  for (let y = room.y; y < room.y + room.h; y++) {
    for (let x = room.x; x < room.x + room.w; x++) {
      grid[y][x] = FLOOR;
    }
  }
}

// Returns the center tile of a room (nice place to put stairs or player)
function roomCenter(room) {
  return {
    x: room.x + Math.floor(room.w / 2),
    y: room.y + Math.floor(room.h / 2),
  };
}

// Carve a simple L-shaped corridor between two points
function carveCorridor(grid, a, b) {
  let x = a.x;
  let y = a.y;
  const horizontalFirst = Math.random() < 0.5;

  if (horizontalFirst) {
    while (x !== b.x) { grid[y][x] = FLOOR; x += x < b.x ? 1 : -1; }
    while (y !== b.y) { grid[y][x] = FLOOR; y += y < b.y ? 1 : -1; }
  } else {
    while (y !== b.y) { grid[y][x] = FLOOR; y += y < b.y ? 1 : -1; }
    while (x !== b.x) { grid[y][x] = FLOOR; x += x < b.x ? 1 : -1; }
  }
  grid[y][x] = FLOOR;
}

/* ============================================================
   ENTITIES (player + monsters)
   We create objects for the player and enemies. Each one has x/y
   coordinates, HP, attack power, and other simple stats.
   ============================================================ */

function createPlayer(x, y) {
  // use saved upgrades so the player gets stronger between runs
  const maxHp = persistent.baseMaxHp;
  const atk = persistent.baseAtk;
  return { x, y, hp: maxHp, maxHp, atk };
}

function spawnEnemies(dungeon, floorNum) {
  const enemies = [];
  const types = Object.keys(ENEMY_TEMPLATES);
  const roomsForEnemies = dungeon.rooms.slice(1); // skip player's starting room

  // put 0-2 enemies in each other room
  roomsForEnemies.forEach(room => {
    const count = randomEnemyCountForRoom();
    for (let i = 0; i < count; i++) {
      const pos = randomFloorTileInRoom(dungeon.grid, room);
      if (!pos) continue;
      const type = types[Math.floor(Math.random() * types.length)];
      enemies.push(createEnemy(type, pos.x, pos.y, floorNum));
    }
  });

  return enemies;
}

function randomEnemyCountForRoom() {
  const roll = Math.random();
  if (roll < 0.55) return 1; // most rooms get 1 enemy
  if (roll < 0.70) return 2; // some rooms get 2
  return 0; // a few rooms are empty
}

function randomFloorTileInRoom(grid, room) {
  // try up to 20 times to find an empty floor tile inside the room
  for (let attempt = 0; attempt < 20; attempt++) {
    const x = room.x + Math.floor(Math.random() * room.w);
    const y = room.y + Math.floor(Math.random() * room.h);
    if (grid[y][x] === FLOOR) return { x, y };
  }
  return null;
}

function createEnemy(type, x, y, floorNum) {
  const template = ENEMY_TEMPLATES[type];
  // make enemies scale slightly with the floor so things get harder
  const scale = 1 + (floorNum - 1) * 0.15;

  return {
    type,
    name: template.name,
    x, y,
    hp: Math.round(template.hp * scale),
    maxHp: Math.round(template.hp * scale),
    atk: Math.max(1, Math.round(template.atk * scale)),
    detect: template.detect,
    gold: template.gold || 1,
  };
}

/* ============================================================
   TURNS, MOVEMENT & COMBAT
   The game is turn-based: when the player moves or waits, all
   enemies get to act after the player. Walking into an enemy
   attacks it instead of moving onto the tile.
   ============================================================ */

function tryPlayerMove(dx, dy) {
  if (state.gameOver) return; // don't allow moves when game over

  const nx = state.player.x + dx;
  const ny = state.player.y + dy;
  if (!inBounds(nx, ny)) return; // ignore moves outside the map

  const targetTile = state.map[ny][nx];

  if (targetTile === WALL) {
    return; // bumping a wall does nothing and doesn't cost a turn
  }

  const target = enemyAt(nx, ny); // check if an enemy stands there
  if (target) {
    // attack the enemy
    resolveAttack(state.player, target, 'You', target.name);
  } else {
    // move the player to the new tile
    state.player.x = nx;
    state.player.y = ny;

    if (targetTile === STAIRS) {
      // stepping on stairs heals a little and moves down one floor
      const heal = state.floor; // heal amount equals floor number
      const prevHp = state.player.hp;
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + heal);
      const actualHealed = state.player.hp - prevHp;
      if (actualHealed > 0) addMessage(`You recover ${actualHealed} HP.`);

      descend();
      return; // descending creates a new floor, skip the enemy turn for now
    }
  }

  // after the player's action, enemies take their turns
  enemyTurn();
  render(); // redraw everything
}

function waitTurn() {
  if (state.gameOver) return;
  addMessage('You wait.');
  enemyTurn();
  render();
}

// Handles an attack from attacker to defender
function resolveAttack(attacker, defender, attackerLabel, defenderLabel) {
  // simple damage roll: attack + random(0..2) but at least 1
  const dmg = Math.max(1, attacker.atk + Math.floor(Math.random() * 3) - 1);
  defender.hp -= dmg;
  addMessage(`${attackerLabel} hit${attackerLabel === 'You' ? '' : 's'} ${defenderLabel} for ${dmg}.`);

  if (defender.hp <= 0) {
    if (defender === state.player) {
      handleGameOver(); // player died
    } else {
      // enemy died: give gold and remove from list
      addMessage(`The ${defender.name} is defeated!`);
      const gained = defender.gold || 1;
      persistent.gold += gained;
      savePersistent();
      addMessage(`You gain ${gained} gold.`);

      state.enemies = state.enemies.filter(e => e !== defender);
    }
  }
}

// All enemies act once after the player moves
function enemyTurn() {
  if (state.gameOver) return;

  state.enemies.forEach(enemy => {
    if (enemy.hp <= 0) return; // dead enemies do nothing

    const dist = chebyshevDistance(enemy, state.player); // how far are they?

    if (dist === 1) {
      // if adjacent, attack the player
      resolveAttack(enemy, state.player, enemy.name, 'you');
      return;
    }

    if (dist <= enemy.detect) {
      // if player is close enough, step toward the player
      stepEnemyToward(enemy, state.player);
    } else if (Math.random() < 0.5) {
      // otherwise sometimes wander randomly
      wanderEnemy(enemy);
    }
  });
}

// Move an enemy one step closer to the target (player)
function stepEnemyToward(enemy, target) {
  const dx = Math.sign(target.x - enemy.x);
  const dy = Math.sign(target.y - enemy.y);
  const preferHorizontal = Math.abs(target.x - enemy.x) > Math.abs(target.y - enemy.y);

  const tryOrder = preferHorizontal
    ? [{ x: enemy.x + dx, y: enemy.y }, { x: enemy.x, y: enemy.y + dy }]
    : [{ x: enemy.x, y: enemy.y + dy }, { x: enemy.x + dx, y: enemy.y }];

  for (const step of tryOrder) {
    if (canEnemyStandOn(step.x, step.y)) {
      enemy.x = step.x;
      enemy.y = step.y;
      return;
    }
  }
}

// Move an enemy in a random direction (if possible)
function wanderEnemy(enemy) {
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const [dx, dy] = dirs[Math.floor(Math.random() * dirs.length)];
  const nx = enemy.x + dx;
  const ny = enemy.y + dy;
  if (canEnemyStandOn(nx, ny)) {
    enemy.x = nx;
    enemy.y = ny;
  }
}

// Check if an enemy can stand on a tile (not wall, not player, not another enemy)
function canEnemyStandOn(x, y) {
  if (!inBounds(x, y)) return false;
  if (state.map[y][x] === WALL) return false;
  if (x === state.player.x && y === state.player.y) return false;
  if (enemyAt(x, y)) return false;
  return true;
}

/* ============================================================
   FLOORS, GAME OVER & RESTART
   Functions for changing floors, handling death, and starting
   a new game run.
   ============================================================ */

function descend() {
  state.floor += 1;
  const dungeon = generateDungeon(state.floor);
  state.map = dungeon.grid;
  state.player.x = dungeon.playerStart.x;
  state.player.y = dungeon.playerStart.y;
  state.enemies = spawnEnemies(dungeon, state.floor);
  addMessage(`You descend to floor ${state.floor}.`);
  render();
}

function handleGameOver() {
  state.gameOver = true;
  addMessage('You have fallen...');
  document.getElementById('final-floor-text').textContent = `You reached floor ${state.floor}.`;
  document.getElementById('game-over-overlay').classList.remove('hidden');
}

function restartGame() {
  // instead of immediately restarting we show upgrades so the player
  // can spend gold between runs
  document.getElementById('game-over-overlay').classList.add('hidden');
  openUpgradesOverlay();
}

function startNewRun() {
  // reset the important state and generate a fresh dungeon
  state.floor = 1;
  const dungeon = generateDungeon(1);
  state.map = dungeon.grid;
  state.player = createPlayer(dungeon.playerStart.x, dungeon.playerStart.y);
  state.enemies = spawnEnemies(dungeon, 1);
  state.gameOver = false;
  state.messages = [];

  addMessage('You descend into the dungeon...');
  render();
}

/* ============================================================
   RENDERING
   These functions draw the map, the player, and enemies on the
   canvas using simple shapes. The drawing uses the COLORS we
   read from the CSS variables at the top.
   ============================================================ */

function render() {
  // clear the canvas with the background color
  ctx.fillStyle = COLORS.stoneDark;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // draw every tile in the map
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      drawTile(state.map[y][x], x, y);
    }
  }

  // draw enemies on top of tiles
  state.enemies.forEach(drawEnemy);
  // draw the player last so they appear above tiles and enemies
  drawPlayer(state.player.x, state.player.y);

  updateHUD(); // refresh the HUD text and HP bar
}

function drawTile(tile, x, y) {
  const px = x * TILE;
  const py = y * TILE;

  if (tile === WALL) {
    ctx.fillStyle = COLORS.stoneMid;
    ctx.fillRect(px, py, TILE, TILE);
    return;
  }

  // floor tile drawing
  ctx.fillStyle = COLORS.stoneTile;
  ctx.fillRect(px, py, TILE, TILE);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);

  // draw the stairs as a bright square in the middle of the tile
  if (tile === STAIRS) {
    ctx.fillStyle = COLORS.amber;
    ctx.fillRect(px + TILE * 0.25, py + TILE * 0.25, TILE * 0.5, TILE * 0.5);
  }
}

function drawPlayer(x, y) {
  // draw the player using simple circles and rectangles
  const cx = x * TILE + TILE / 2;
  const cy = y * TILE + TILE / 2;
  const r = TILE * 0.36;

  ctx.fillStyle = COLORS.moss;
  circle(cx, cy + r * 0.2, r);

  ctx.fillStyle = COLORS.skin;
  circle(cx, cy - r * 0.6, r * 0.55);

  ctx.fillStyle = COLORS.stoneDark;
  ctx.fillRect(cx - r * 0.3, cy - r * 0.7, r * 0.16, r * 0.16);
  ctx.fillRect(cx + r * 0.14, cy - r * 0.7, r * 0.16, r * 0.16);

  ctx.strokeStyle = COLORS.parchment;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.9, cy - r * 0.1);
  ctx.lineTo(cx + r * 1.5, cy - r * 0.8);
  ctx.stroke();
}

function drawEnemy(enemy) {
  if (enemy.type === 'rat') drawRat(enemy.x, enemy.y);
  else if (enemy.type === 'goblin') drawGoblin(enemy.x, enemy.y);
}

function drawRat(x, y) {
  const cx = x * TILE + TILE / 2;
  const cy = y * TILE + TILE / 2;
  const r = TILE * 0.26;

  ctx.strokeStyle = COLORS.furBrown;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.9, cy + r * 0.4);
  ctx.quadraticCurveTo(cx + r * 1.7, cy + r * 0.1, cx + r * 1.4, cy - r * 0.5);
  ctx.stroke();

  ctx.fillStyle = COLORS.furBrown;
  ellipse(cx, cy + r * 0.15, r * 1.05, r * 0.75);

  ctx.beginPath();
  ctx.moveTo(cx - r * 0.55, cy - r * 0.35);
  ctx.lineTo(cx - r * 0.9, cy - r * 1.05);
  ctx.lineTo(cx - r * 0.15, cy - r * 0.55);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + r * 0.55, cy - r * 0.35);
  ctx.lineTo(cx + r * 0.9, cy - r * 1.05);
  ctx.lineTo(cx + r * 0.15, cy - r * 0.55);
  ctx.fill();

  // little eyes
  ctx.fillStyle = COLORS.ember;
  ctx.fillRect(cx - r * 0.4, cy - r * 0.1, r * 0.22, r * 0.22);
  ctx.fillRect(cx + r * 0.18, cy - r * 0.1, r * 0.22, r * 0.22);
}

function drawGoblin(x, y) {
  const cx = x * TILE + TILE / 2;
  const cy = y * TILE + TILE / 2;
  const r = TILE * 0.4;

  ctx.fillStyle = COLORS.mossDark;
  circle(cx, cy + r * 0.15, r);

  ctx.fillStyle = COLORS.moss;
  circle(cx, cy - r * 0.5, r * 0.5);

  ctx.strokeStyle = COLORS.stoneDark;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.35, cy - r * 0.66);
  ctx.lineTo(cx - r * 0.08, cy - r * 0.54);
  ctx.moveTo(cx + r * 0.35, cy - r * 0.66);
  ctx.lineTo(cx + r * 0.08, cy - r * 0.54);
  ctx.stroke();

  ctx.fillStyle = COLORS.amber;
  ctx.fillRect(cx - r * 0.3, cy - r * 0.55, r * 0.18, r * 0.18);
  ctx.fillRect(cx + r * 0.12, cy - r * 0.55, r * 0.18, r * 0.18);
}

// small helpers for drawing shapes
function circle(cx, cy, r) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
}
function ellipse(cx, cy, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

// Update visible HUD values for HP, floor and gold
function updateHUD() {
  const hp = Math.max(0, state.player.hp);
  document.getElementById('hp-text').textContent = `${hp}/${state.player.maxHp}`;
  document.getElementById('hp-bar-fill').style.width = `${(hp / state.player.maxHp) * 100}%`;
  document.getElementById('floor-text').textContent = state.floor;
  document.getElementById('gold-text').textContent = persistent.gold;
}

// Add a message to the message log and keep only a few recent ones
function addMessage(msg) {
  state.messages.push(msg);
  if (state.messages.length > 4) state.messages.shift();

  const log = document.getElementById('message-log');
  log.innerHTML = '';
  state.messages.forEach(m => {
    const line = document.createElement('div');
    line.textContent = m;
    log.appendChild(line);
  });
}

/* ============================================================
   HELPERS: utility functions used by many parts of the code
   ============================================================ */
function inBounds(x, y) {
  return x >= 0 && x < COLS && y >= 0 && y < ROWS;
}

function enemyAt(x, y) {
  return state.enemies.find(e => e.x === x && e.y === y && e.hp > 0);
}

// Chebyshev distance measures how many king-steps it takes to reach
// from one square to another on a chessboard (max of dx and dy)
function chebyshevDistance(a, b) {
  return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
}

/* ============================================================
   INPUT: keyboard and button handlers
   This code listens for keys and button clicks and turns them
   into game actions like moving or waiting.
   ============================================================ */

window.addEventListener('keydown', (e) => {
  const moves = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };

  if (moves[e.key]) {
    e.preventDefault();
    tryPlayerMove(moves[e.key][0], moves[e.key][1]);
  } else if (e.key === ' ') {
    e.preventDefault();
    waitTurn();
  }
});

// hook up on-screen buttons for touch or mouse
document.getElementById('btn-up').addEventListener('click', () => tryPlayerMove(0, -1));
document.getElementById('btn-down').addEventListener('click', () => tryPlayerMove(0, 1));
document.getElementById('btn-left').addEventListener('click', () => tryPlayerMove(-1, 0));
document.getElementById('btn-right').addEventListener('click', () => tryPlayerMove(1, 0));
document.getElementById('btn-wait').addEventListener('click', waitTurn);
document.getElementById('btn-restart').addEventListener('click', restartGame);

/* ============================================================
   UPGRADES UI
   Simple functions to open/close the upgrade screen, show
   current prices, and buy upgrades with the gold you earned.
   ============================================================ */
function openUpgradesOverlay() {
  document.getElementById('upgrades-overlay').classList.remove('hidden');
  updateUpgradesUI();
}
function closeUpgradesOverlay() {
  document.getElementById('upgrades-overlay').classList.add('hidden');
}
function updateUpgradesUI() {
  document.getElementById('upgrades-gold-text').textContent = `Gold: ${persistent.gold}`;
  document.getElementById('current-maxhp').textContent = persistent.baseMaxHp;
  document.getElementById('current-atk').textContent = persistent.baseAtk;
  const costMaxHp = persistent.baseMaxHp + 1; // cost equals next value
  const costAtk = persistent.baseAtk + 1;
  document.getElementById('cost-maxhp').textContent = costMaxHp;
  document.getElementById('cost-atk').textContent = costAtk;
}

function buyMaxHp() {
  const cost = persistent.baseMaxHp + 1;
  if (persistent.gold >= cost) {
    persistent.gold -= cost;
    persistent.baseMaxHp += 1;
    savePersistent();
    addMessage(`Purchased +1 Max HP (cost ${cost}).`);
    updateUpgradesUI();
  } else {
    addMessage('Not enough gold.');
  }
}

function buyAtk() {
  const cost = persistent.baseAtk + 1;
  if (persistent.gold >= cost) {
    persistent.gold -= cost;
    persistent.baseAtk += 1;
    savePersistent();
    addMessage(`Purchased +1 Atk (cost ${cost}).`);
    updateUpgradesUI();
  } else {
    addMessage('Not enough gold.');
  }
}

document.getElementById('buy-maxhp').addEventListener('click', buyMaxHp);
document.getElementById('buy-atk').addEventListener('click', buyAtk);
document.getElementById('start-next').addEventListener('click', () => { closeUpgradesOverlay(); startNewRun(); });

/* ============================================================
   BOOT: initialize the game when the page loads
   We create the first dungeon, the player, enemies and then
   draw the initial screen.
   ============================================================ */
function initGame() {
  const dungeon = generateDungeon(1);
  state.map = dungeon.grid;
  state.player = createPlayer(dungeon.playerStart.x, dungeon.playerStart.y);
  state.enemies = spawnEnemies(dungeon, 1);
  state.gameOver = false;
  state.messages = [];

  addMessage('You descend into the dungeon...');
  render();
}

// start the game now
initGame();

</script>
